<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
<rect width="760" height="360" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf222e"/></marker>
</defs>
<text x="24" y="36" font-size="17" font-weight="600" fill="#1f2328">Three paths after the split</text>
<rect x="230" y="76" width="300" height="48" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/>
<text x="380" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Votes remain, labor power is gone</text>
<g fill="none" stroke="#8c959f" stroke-width="1.5">
<path d="M300 124V150H128V234.0" marker-end="url(#a)"/>
<path d="M380 124V234.0" marker-end="url(#a)"/>
<path d="M460 124V150H632V234.0" marker-end="url(#a)"/>
</g>
<rect x="25.0" y="234.0" width="206" height="72" rx="8" fill="#1a7f37" fill-opacity="0.08" stroke="#1a7f37" stroke-width="1.5"/><text x="128" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">A. Redistributive pact</text><text x="128" y="286" text-anchor="middle" font-size="11.5" fill="#57606a">Wealth fund, dividends, UBI</text>
<rect x="277.0" y="234.0" width="206" height="72" rx="8" fill="#cf222e" fill-opacity="0.08" stroke="#cf222e" stroke-width="1.5"/><text x="380" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">B. Polarization, strongmen</text><text x="380" y="286" text-anchor="middle" font-size="11.5" fill="#57606a">Redistribution blocked</text>
<rect x="529.0" y="234.0" width="206" height="72" rx="8" fill="#57606a" fill-opacity="0.08" stroke="#57606a" stroke-width="1.5"/><text x="632" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">C. Hollow elections</text><text x="632" y="286" text-anchor="middle" font-size="11.5" fill="#57606a">Form kept, power elsewhere</text>
<g fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4">
<path d="M231.0 290H277.0" marker-end="url(#r)"/>
<path d="M483.0 290H529.0" marker-end="url(#r)"/>
</g>
<text x="254.0" y="322" text-anchor="middle" font-size="11.5" fill="#cf222e">legislation fails</text>
<text x="506.0" y="322" text-anchor="middle" font-size="11.5" fill="#cf222e">in the name of order</text>
<text x="24" y="345" font-size="12" fill="#57606a">The paths are not exclusive and may follow one another.</text>
</svg>
