<rect x="277.0" y="234.0" width="206" height="72" rx="8" fill="#cf222e" fill-opacity="0.08" stroke="#cf222e" stroke-width="1.5"/><text x="380" y="264" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">B. Polarisation, homme fort</text><text x="380" y="286" text-anchor="middle" font-size="11.5" fill="#57606a">Redistribution bloquée</text>
